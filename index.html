<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie Dédal des Couleurs | Galerie de photographie d'art à Paris</title>
  <meta name="description" content="Galerie Dédal des Couleurs à Paris : découvrez nos photographies d'art exposées, notre histoire, nos horaires et inscrivez-vous gratuitement à notre newsletter.">
  <meta property="og:title" content="Galerie Dédal des Couleurs">
  <meta property="og:description" content="Galerie de photographie d'art à Paris : nos œuvres, notre histoire, nos horaires et notre newsletter.">
  <meta property="og:image" content="images/hero-lanternes-800.webp">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Freckle+Face&amp;display=swap">
  <link rel="preload" href="images/hero-lanternes-800.webp" as="image" type="image/webp" media="(max-width: 899px)">
  <link rel="preload" href="images/hero-lanternes.webp" as="image" type="image/webp" media="(min-width: 900px)">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://kit.fontawesome.com/104174e666.js" crossorigin="anonymous" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="entete">
    <div class="conteneur entete__interieur">
      <a class="entete__logo" href="#accueil">
        <img src="images/logo-dedal.png" alt="Dédal des Couleurs, retour à l'accueil" width="128" height="96">
      </a>

      <button class="bouton-icone bouton-menu" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu-principal">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

      <nav class="menu" id="menu-principal" aria-label="Navigation principale">
        <div class="menu__haut">
          <img class="menu__logo" src="images/logo-dedal.png" alt="" width="128" height="96">
          <button class="bouton-icone bouton-fermer" type="button" aria-label="Fermer le menu">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <ul class="menu__liste">
          <li><a class="menu__lien" href="#accueil">Accueil</a></li>
          <li><a class="menu__lien" href="#oeuvres">Œuvres</a></li>
          <li><a class="menu__lien" href="#histoire">Histoire</a></li>
          <li><a class="menu__lien menu__lien--inscription" href="#inscription">Inscription</a></li>
        </ul>
      </nav>
    </div>
    <div class="voile-menu"></div>
  </header>

  <main id="contenu">
    <section class="accueil" id="accueil" aria-labelledby="titre-accueil">
      <div class="conteneur accueil__contenu">
        <h1 class="accueil__titre" id="titre-accueil">Galerie Dédal des Couleurs</h1>
        <p class="accueil__texte">Venez découvrir les photographies de nos artistes photographes exposés dans notre galerie de 50m²</p>
        <a class="bouton accueil__bouton" href="#oeuvres">Nous découvrir</a>
      </div>
    </section>
  </main>
</body>
</html>
